name: Deploy WordPress theme
# Re-verify deployed theme checksum; on success, run the refreshed live SEO audit.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/mrseo-tech/**'
      - '.github/workflows/deploy-theme.yml'

permissions:
  contents: read

concurrency:
  group: mrseo-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate theme files
        run: |
          test -f wp-content/themes/mrseo-tech/style.css
          test -f wp-content/themes/mrseo-tech/functions.php
          test -f wp-content/themes/mrseo-tech/front-page.php
          find wp-content/themes/mrseo-tech -name '*.php' -print0 | xargs -0 -n 1 php -l
          node --check wp-content/themes/mrseo-tech/assets/site.js
          python3 -m py_compile scripts/verify-live-international-seo.py
          test -f wp-content/themes/mrseo-tech/ecommerce-landing.php
          test -f wp-content/themes/mrseo-tech/inc/service-editorial.php
          grep -q "X-Robots-Tag: noindex, nofollow" wp-content/themes/mrseo-tech/functions.php

      - name: Configure SSH
        env:
          DEPLOY_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy theme files only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          REMOTE_THEME="/home/fv630979/mrseo.tech/www/wp-content/themes/mrseo-tech"
          SSH_ARGS="-i $HOME/.ssh/deploy_key -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          ssh $SSH_ARGS "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_THEME'"
          rsync -az --checksum \
            -e "ssh $SSH_ARGS" \
            wp-content/themes/mrseo-tech/ \
            "$SSH_USER@$SSH_HOST:$REMOTE_THEME/"
          echo "Theme files transferred; WordPress core, wp-config.php, plugins and DB unchanged."
          # Verify actual deployed bytes; hardcoded script/theme versions break on every legitimate update.
          LOCAL_FUNCTIONS_SHA="$(sha256sum wp-content/themes/mrseo-tech/functions.php | cut -d' ' -f1)"
          REMOTE_FUNCTIONS_SHA="$(ssh $SSH_ARGS "$SSH_USER@$SSH_HOST" "sha256sum '$REMOTE_THEME/functions.php' | cut -d' ' -f1")"
          test "$LOCAL_FUNCTIONS_SHA" = "$REMOTE_FUNCTIONS_SHA"
          ssh $SSH_ARGS "$SSH_USER@$SSH_HOST" "test -f '$REMOTE_THEME/assets/site.js' && test -f '$REMOTE_THEME/assets/language-dropdown.css' && test -f '$REMOTE_THEME/inc/language-dropdown.php'"
          echo "Remote theme files verified by checksum; WordPress core and config unchanged."
