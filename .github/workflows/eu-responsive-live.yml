name: EU staged pages responsive browser audit

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy WordPress theme
    types:
      - completed

permissions:
  contents: read

jobs:
  eu-visual:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit all six EU languages on desktop and mobile
        env:
          MRSEO_TEST_ORIGIN: https://mrseo.tech
        run: node scripts/verify-live-eu-responsive.cjs
      - name: Upload screenshots and detailed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-responsive-qa
          path: |
            shots/eu-*.jpg
            shots/eu-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
