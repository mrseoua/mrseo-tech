name: EU staged pages responsive browser audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify-live-eu-responsive.cjs'
      - 'wp-content/themes/mrseo-tech/assets/eu-expansion.css'
      - 'wp-content/themes/mrseo-tech/inc/eu-routing.php'
      - '.github/workflows/eu-responsive-live.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/eu-responsive-live.yml'
      - 'scripts/verify-live-eu-responsive.cjs'
  workflow_run:
    workflows:
      - Deploy WordPress theme
    types:
      - completed

permissions:
  contents: read

# Avoid overlapping expensive Chromium suites when several PR commits are pushed.
concurrency:
  group: eu-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eu-visual:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit all six EU languages on desktop and mobile
        env:
          MRSEO_TEST_ORIGIN: https://mrseo.tech
          MRSEO_QA_FOCUSED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          MRSEO_TEST_INVALID_FORMS: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: node scripts/verify-live-eu-responsive.cjs
      - name: Upload screenshots and detailed diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eu-responsive-qa
          path: |
            shots/eu-*.jpg
            shots/eu-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
