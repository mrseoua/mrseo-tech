name: Russian WebDev visual QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/themes/mrseo-tech/**'
      - 'scripts/verify-ru-webdev-visual.cjs'
      - '.github/workflows/ru-webdev-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ru-webdev:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: mrseo_ci
          MYSQL_USER: mrseo_ci
          MYSQL_PASSWORD: local_ci_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, pdo_mysql, mbstring, intl, zip
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Boot isolated WordPress with current RU theme
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          php /tmp/wp-cli.phar core download --path="$GITHUB_WORKSPACE/preview-wp" --allow-root --quiet
          php /tmp/wp-cli.phar config create --path="$GITHUB_WORKSPACE/preview-wp" --dbname=mrseo_ci --dbuser=mrseo_ci --dbpass=local_ci_only --dbhost=127.0.0.1:3306 --skip-check --allow-root --quiet
          php /tmp/wp-cli.phar core install --path="$GITHUB_WORKSPACE/preview-wp" --url=http://127.0.0.1:8080 --title="MrSeo UA QA" --admin_user=preview --admin_password=preview_ci_only --admin_email=preview@example.com --skip-email --allow-root --quiet
          cp -a wp-content/themes/mrseo-tech "$GITHUB_WORKSPACE/preview-wp/wp-content/themes/"
          php /tmp/wp-cli.phar theme activate mrseo-tech --path="$GITHUB_WORKSPACE/preview-wp" --allow-root
          php /tmp/wp-cli.phar option update blog_public 0 --path="$GITHUB_WORKSPACE/preview-wp" --allow-root
          php /tmp/wp-cli.phar rewrite structure '/%postname%/' --path="$GITHUB_WORKSPACE/preview-wp" --allow-root
          cat > "$GITHUB_WORKSPACE/preview-wp/router.php" <<'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          if ($path !== '/' && is_file(__DIR__ . $path)) return false;
          require __DIR__ . '/index.php';
          PHP
          php -S 127.0.0.1:8080 -t "$GITHUB_WORKSPACE/preview-wp" "$GITHUB_WORKSPACE/preview-wp/router.php" > /tmp/mrseo-ua-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/ru/client-portals/ -o /tmp/ua-preview.html; then break; fi
            sleep 2
          done
          test -s /tmp/ua-preview.html
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify seven RU WebDev pages at desktop and phone sizes
        env:
          MRSEO_TEST_ORIGIN: http://127.0.0.1:8080
        run: node scripts/verify-ru-webdev-visual.cjs
      - name: Upload all 63 screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-webdev-seven-visuals
          path: |
            shots/ru-webdev/*.png
            shots/ru-webdev/diagnostics.json
            /tmp/mrseo-ua-preview.log
          if-no-files-found: warn
          retention-days: 7
