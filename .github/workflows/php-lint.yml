name: Theme international QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax across the theme
        run: |
          find wp-content/themes/mrseo-tech -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
      - name: Check Earth module syntax
        run: |
          node --input-type=module --check < wp-content/themes/mrseo-tech/assets/orbit-earth-three.js
      - name: Check motion-scenes JavaScript syntax
        run: |
          node --check wp-content/themes/mrseo-tech/assets/motion-scenes.js
      - name: Verify international content and launch safeguards
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('wp-content/themes/mrseo-tech')
          content=(root/'inc/international-content.php').read_text()
          data_match=re.search(r"<<<'MRSEO_INT_DATA'\n(.*?)\nMRSEO_INT_DATA;",content,re.S)
          assert data_match, 'Missing localization data'
          data=json.loads(data_match.group(1))
          slugs={'','seo','seo-audit','ecommerce-seo','google-ads','analytics','about','contact','portfolio'}
          for locale in ('pl','de'):
              pages=data['pages'][locale]
              assert set(pages)==slugs, (locale,'Incomplete country routes')
              assert len({p['title'] for p in pages.values()})==9
              for slug in ('seo','seo-audit','ecommerce-seo','google-ads','analytics'):
                  assert len(pages[slug]['problems'])==3
                  assert len(pages[slug]['solutions'])==3
                  assert len(pages[slug]['verification'])==4
          routes=(root/'inc/i18n-routing.php').read_text()
          template=(root/'international-landing.php').read_text()
          css=(root/'assets/international.css').read_text()
          functions=(root/'functions.php').read_text()
          assert 'international-sitemap.php' in routes
          assert "if($slug==='horoshop' && !in_array($lang,array('uk','ru'),true))" in routes
          home=(root/'orbit-lab.php').read_text()
          chrome=(root/'header.php').read_text()+(root/'footer.php').read_text()
          home_text=(root/'inc/international-home-copy.php').read_text()
          home_match=re.search(r"<<<'MRSEO_HOME_TRANSLATIONS'\n(.*?)\nMRSEO_HOME_TRANSLATIONS;",home_text,re.S)
          assert home_match, 'Missing Polish/German homepage translations'
          home_translations=json.loads(home_match.group(1))
          for locale in ('pl','de'):
              assert len(home_translations[locale])>=78, (locale,'Missing homepage copy')
              assert all(isinstance(v,str) and v.strip() for v in home_translations[locale].values())
          assert "mrseo_int_home_copy($l,$en)" in routes
          assert "mrseo_slug()===''?'/orbit-lab.php':'/international-landing.php'" in routes
          assert '$nodes=array_slice($nodes,0,6)' in home
          assert 'mhe-six-services' in home
          # Mega navigation replaced the legacy inline service array.
          mega_file=(root/'inc/mega-menu.php').read_text()
          mega_match=re.search(r"<<<'MRSEO_MEGA_DATA'\\n(.*?)\\nMRSEO_MEGA_DATA;", mega_file, re.S)
          assert mega_match, 'Missing localized mega-menu data'
          mega=json.loads(mega_match.group(1))
          assert set(mega)=={'uk','ru','en','pl','de'}
          for locale,copy in mega.items():
              assert set(copy['sections'])=={'seo','ads','commerce','dev','data'}
              assert all(copy['links'].get(slug) for slug in ('seo','seo-audit','ecommerce-seo','google-ads','analytics','web-development'))
              assert copy['cta'] and copy['ctaText']
          assert 'mrseo_render_mega_menu()' in (root/'header.php').read_text()
          assert 'mrseo_render_mega_menu()' in (root/'header-international.php').read_text()
          assert 'mrseo_render_mega_menu(true)' in (root/'header-international.php').read_text()
          assert 'mrseo_int_pages()' in mega_file, 'PL/DE URLs must be whitelisted'
          assert "if (!in_array($slug, $available, true)) continue;" in mega_file
          assert 'orbit-earth-three.js?v=5' in home, 'Shared real Earth renderer must remain'
          dev_php=(root/'inc/development-content.php').read_text()
          dev_match=re.search(r"<<<'MRSEO_DEV_DATA'\n(.*?)\nMRSEO_DEV_DATA;",dev_php,re.S)
          assert dev_match, 'Missing Web Development data'
          dev=json.loads(dev_match.group(1))
          assert set(dev)=={'uk','ru','en','pl','de'}
          assert len({page['title'] for page in dev.values()})==5
          for locale,page in dev.items():
              assert len(page['problems'])==3 and len(page['solutions'])==3
              assert len(page['capabilities'])==6 and len(page['workflow'])==4
              assert len(page['verification'])==4 and len(page['faq'])==3
              assert page['description'] and page['headline'] and page['lead']
          dev_template=(root/'development-landing.php').read_text()
          assert "mrseo_render_motion_scene('web-development',$dev_locale)" in dev_template
          assert 'intl-earth-core' not in dev_template and 'orbit-earth-three.js?v=6' not in dev_template
          assert 'name="dev-problem"' in dev_template
          assert "mrseo_dev_page()" in routes or 'mrseo_dev_page' in routes
          assert 'web-development' in routes and 'web-development' in home
          assert "mrseo_int_pages()" in (root/'inc/international-sitemap.php').read_text()
          assert (root/'assets/development.css').read_text().count('{')==(root/'assets/development.css').read_text().count('}')
          assert 'mrseo_render_motion_scene($mrseo_slug,$mrseo_lang)' in template
          assert 'intl-earth-core' not in template and 'orbit-earth-three.js?v=6' not in template
          assert 'name="intl-problem-solution"' in template
          assert css.count('{')==css.count('}')
          motion=(root/'inc/motion-scenes.php').read_text()
          motion_copy=(root/'inc/motion-scenes-copy.php').read_text()
          motion_match=re.search(r"<<<'MRSEO_SCENES_DATA'\n(.*?)\nMRSEO_SCENES_DATA;",motion_copy,re.S)
          assert motion_match, 'Missing motion scene localization'
          scene_data=json.loads(motion_match.group(1))
          expected={'seo','seo-audit','ecommerce-seo','google-ads','analytics','web-development','service-websites','performance-max','about','portfolio','contact'}
          assert set(scene_data)==expected
          for slug,translations in scene_data.items():
              assert set(translations)=={'uk','ru','en','pl','de'}, (slug,'missing locale')
              for locale,copy in translations.items():
                  assert copy['name'] and copy['intro'] and len(copy['tabs'])==3 and len(copy['steps'])==3
          for page in ('seo-landing.php','service-localized.php','ecommerce-landing.php','specialized-landing.php'):
              assert 'mrseo_render_motion_scene(' in (root/page).read_text()
          assert 'mrseo_render_motion_scene' in motion
          assert (root/'assets/motion-scenes.css').read_text().count('{')==(root/'assets/motion-scenes.css').read_text().count('}')
          assert 'mrseo-motion-scenes' in functions
          assert 'orbit-earth-three.js?v=5' in home, '3D Earth remains only on the homepage'
          assert "X-Robots-Tag: noindex, nofollow" in functions, 'Do not disable staging noindex'
          print('11 localized motion scenes × 5 languages; 3D Earth only on homepages; 5 development pages and noindex verified')
          PY
