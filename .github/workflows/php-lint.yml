name: PHP syntax checks

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/mrseo-tech/**/*.php'
      - '.github/workflows/php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax across the theme
        run: |
          find wp-content/themes/mrseo-tech -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
