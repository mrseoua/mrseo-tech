name: UK release safety QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uk-release-qa.yml'
      - 'wp-content/themes/mrseo-tech/**'
      - 'scripts/verify-*.py'
      - 'scripts/verify-*.php'
      - 'scripts/verify-*.cjs'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax of entire WordPress theme
        run: find wp-content/themes/mrseo-tech -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: British content and real service destinations
        run: python3 scripts/verify-en-gb-parity.py
      - name: Polish commercial landings and 25 real menu links
        run: python3 scripts/verify-pl-complete.py
      - name: German commercial landings and 25 real menu links
        run: python3 scripts/verify-de-complete.py
      - name: French commercial landings and 25 real menu links
        run: python3 scripts/verify-fr-complete.py
      - name: Italian commercial landings and 25 real menu links
        run: python3 scripts/verify-it-complete.py
      - name: Spanish commercial landings and 25 real menu links
        run: python3 scripts/verify-es-complete.py
      - name: Dutch commercial landings and 25 real menu links
        run: python3 scripts/verify-nl-complete.py
      - name: Romanian commercial landings and 25 real menu links
        run: python3 scripts/verify-ro-complete.py
      - name: Czech commercial landings and 25 real menu links
        run: python3 scripts/verify-cs-complete.py
      - name: Ukrainian and Russian regression tests
        run: |
          python3 scripts/verify-ru-compact.py
          python3 scripts/verify-ru-new-services.py
      - name: International SEO — real canonical URL and hreflang registry
        run: php scripts/verify-international-seo.php
      - name: Browser audit syntax
        run: node --check scripts/verify-live-eu-responsive.cjs
      - name: Confirm indexing stays disabled
        run: |
          grep -q 'X-Robots-Tag: noindex, nofollow' wp-content/themes/mrseo-tech/functions.php
          grep -q 'mrseo_en_gb_route' wp-content/themes/mrseo-tech/inc/en-gb-services.php
