name: International SEO live pre-index audit

on:
  workflow_dispatch:
  workflow_run:
    # Run against published files only, never before the SSH deployment completes.
    workflows: ["Deploy WordPress theme"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-live-international-seo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check live routes, canonical, hreflang and noindex (read only)
        run: python3 scripts/verify-live-international-seo.py
